<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CABF8"/>
      <stop offset="1" stop-color="#2F6BDD"/>
    </linearGradient>
  </defs>

  <!-- 深色终端底 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="116" fill="#FFFFFF" fill-opacity="0.045"/>

  <!-- 终端标题栏三圆点 -->
  <circle cx="126" cy="122" r="17" fill="#FF5F57"/>
  <circle cx="172" cy="122" r="17" fill="#FEBC2E"/>
  <circle cx="218" cy="122" r="17" fill="#28C840"/>

  <!-- 终端分隔线 -->
  <path d="M96 168 H416" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6" stroke-linecap="round"/>

  <!-- 提示符 > -->
  <path d="M168 276 L292 330 L168 384"
        fill="none" stroke="url(#prompt)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 光标 _ -->
  <rect x="322" y="322" width="72" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
