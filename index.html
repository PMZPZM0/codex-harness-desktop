<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ⛔ 隐私加固（09-19 审计中危）：补 CSP——关键收益是封死"注入脚本加载外部代码"
         （script-src 无外域）、object/base/form 劫持；img/fetch 放行 https 与本地协议，
         保证模型输出的外链图片、剪贴板复制远程图、PDF 预览（harness-image iframe）不受影响。
         frame-src 放开（*）：Chromium 内置 PDF 查看器会内部导航到 chrome-extension://，
         白名单挡不住注入脚本什么（渲染内嵌网页本来就靠 webview，不经 CSP）；
         script-src 保留 'unsafe-inline'：GenerativeWidget 的 srcdoc 可视化卡片要在 iframe 里
         跑内联脚本（srcdoc 继承父文档 CSP，不放开就全挂）。 -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob: file: harness-image:; media-src * data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; frame-src *; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="theme-color" content="#171916" />
    <title>Codex Harness Desktop</title>
    <script>
      /* 主题必须在首帧前落到 <html> 上：否则亮色主题用户会先看到深色启动页再跳白（闪烁）。
         与 App.tsx 的 localStorage "theme" 同源（默认 light）。 */
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      /* 启动加载页：JS/CSS 还没加载时也要能显示，所以样式必须内联在这里。
         React 挂载后由 src/components/BootSplash.tsx 用**同一套类名**接手，
         直到首屏会话数据到达才淡出（实测启动到有内容 3.0~3.8s，大半时间在这之后）。 */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #1b1b1a;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      html[data-theme="dark"] .boot-splash {
        background: #171916;
        color: #e8e8e8;
      }
      .boot-splash-logo {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        object-fit: cover;
        display: block;
      }
      .boot-splash-spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(128, 128, 128, 0.28);
        border-top-color: #2f6bdd;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      html[data-theme="dark"] .boot-splash-spinner {
        border-color: rgba(255, 255, 255, 0.16);
        border-top-color: #7cabf8;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-splash p {
        margin: 0;
        font-size: 12px;
        color: #6b6b66;
      }
      html[data-theme="dark"] .boot-splash p {
        color: rgba(255, 255, 255, 0.55);
      }
      /* 淡出：首屏数据到达后由 React 层加这个类，播完再卸载 */
      .boot-splash-leaving {
        animation: boot-fade-out 0.28s ease forwards;
      }
      @keyframes boot-fade-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <img class="boot-splash-logo" src="./icon.png" alt="" />
        <div class="boot-splash-spinner"></div>
        <p>正在启动 Codex Harness…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
