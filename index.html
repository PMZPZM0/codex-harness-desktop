<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ⛔ 隐私加固（09-19 审计中危）：补 CSP——关键收益是封死"注入脚本加载外部代码"
         （script-src 无外域）、object/base/form 劫持；img/fetch 放行 https 与本地协议，
         保证模型输出的外链图片、剪贴板复制远程图、PDF 预览（harness-image iframe）不受影响。
         frame-src 放开（*）：Chromium 内置 PDF 查看器会内部导航到 chrome-extension://，
         白名单挡不住注入脚本什么（渲染内嵌网页本来就靠 webview，不经 CSP）；
         script-src 保留 'unsafe-inline'：GenerativeWidget 的 srcdoc 可视化卡片要在 iframe 里
         跑内联脚本（srcdoc 继承父文档 CSP，不放开就全挂）。 -->
    <!-- ⛔ connect-src 必须放行 data:（09-27 实测白方块事故）：
         PixiJS 用 **fetch** 加载贴图 ⇒ 受 connect-src 管（**不是** img-src）。
         Vite 构建会把 <4KB 的小图（team-office 的 23 张家具贴图全部命中）**内联成 data: URI**，
         而 image 走 fetch 读 data: —— 若 connect-src 不放行 data:，全部贴图被 CSP 拦下，
         渲染成一块块白方块（位置对、贴图空，极易误判为渲染 bug）。
         ⛔ dev 下不复现的原因：dev 贴图走 http://localhost:5173，被已有的 http://localhost:* 放行
         ⇒ **只在打包/构建产物里才暴露**，改完必须用构建产物 + 真实 CSP 验证（见守卫【175】）。
         data: 是本页自身内联内容、无外联能力，放行风险可忽略。 -->
    <!-- ⛔ `pet:` 必须显式列进 img-src（09-30 桌面宠物踩到）：
         CSP 里 `*` 只匹配**网络协议**（http/https/ws…），**不覆盖自定义协议** ——
         它不会自动放行 `pet:`，于是宠物图集被拦成空白（浮窗截图全透明 0% 不透明像素）。
         同类前科：`connect-src` 不放行 `data:` 导致 PixiJS 贴图全变白方块。
         ⛔ 这类问题**只在构建产物 + 真实 CSP 下暴露**，改完必须用构建产物验证（探针已钉）。
         口径与 `harness-image:` 一致：都是本进程注册、内容来自本机可信目录的只读图片协议。 -->
    <!-- ⛔ 同理 `sketch:` 必须显式列进 frame-src（10-05 界面草图）：上面那条口径对 frame-src
         一样成立 —— `*` 不覆盖自定义协议，漏写的话 iframe 会**静默不加载**（表现成弹窗里一块白，
         而不是报错）。草图站是本进程注册的只读静态站，见 electron/sketch-protocol.ts。 -->
    <!-- ⛔ `script-src` 必须含 `blob:`：语音通话的 AudioWorklet 用
         `audioWorklet.addModule(blobUrl)` 注册处理器（`src/voice/capture-worklet.ts` 以
         字符串常量提供源码，走 Blob URL 才不用依赖打包后的资源路径）。
         缺 `blob:` 时 Chromium 直接抛 "Unable to load a worklet's module."，**且不给更明确的
         原因** —— 表现为「模型已就绪但点开始通话就报错」，很容易误判成模型坏了。
         09-19 审计加 CSP 时漏了这一条（其它指令 img/media/connect/worker-src 当时都放了 blob:），
         于是语音通话自那时起就完全无法启动。10-03 修复。
         安全评估：worker-src 本来就允许 blob:（Worker 能执行任意 JS），因此放行 script-src 的
         blob: **不新增攻击面类型**；且页面内容全是自有代码，不接受远程输入。 -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob: file: harness-image: pet:; media-src * data: blob:; font-src 'self' data:; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; frame-src * sketch:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="theme-color" content="#171916" />
    <title>Codex Harness Desktop</title>
    <script>
      /* 主题必须在首帧前落到 <html> 上：否则亮色主题用户会先看到深色启动页再跳白（闪烁）。
         与 App.tsx 的 localStorage "theme" 同源（默认 light）。 */
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
        /* ⛔ 桌面宠物浮窗（?pet=1）必须在**首帧之前**就打上这个标记：
           下面 body 里的启动页是**静态 HTML**，若等到 React 挂载再隐藏，
           透明浮窗上会先闪一整块不透明白底（渲染层判定太晚）。 */
        try {
          if (new URLSearchParams(location.search).get("pet") === "1") {
            document.documentElement.setAttribute("data-pet-window", "1");
          }
        } catch (e) { /* 忽略 */ }
      })();
    </script>
    <style>
      /* 桌面宠物浮窗：整窗透明 + 不出启动页（启动页是不透明白底，会盖住透明窗口） */
      html[data-pet-window="1"],
      html[data-pet-window="1"] body {
        background: transparent;
      }
      html[data-pet-window="1"] .boot-splash {
        display: none;
      }
      /* 启动加载页：JS/CSS 还没加载时也要能显示，所以样式必须内联在这里。
         React 挂载后由 src/components/BootSplash.tsx 用**同一套类名**接手，
         直到首屏会话数据到达才淡出（实测启动到有内容 3.0~3.8s，大半时间在这之后）。 */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #1b1b1a;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      html[data-theme="dark"] .boot-splash {
        background: #171916;
        color: #e8e8e8;
      }
      /* 大 logo 启动页（10-01 复刻 ZCode）：居中一张与桌面图标一致的大 logo，
         呼吸动画给出「活着」的反馈；不放旋转 spinner（ZCode 风格就是干净的 logo）。 */
      .boot-splash-logo {
        width: 136px;
        height: 136px;
        border-radius: 32px;
        object-fit: cover;
        display: block;
        box-shadow: 0 18px 48px rgba(20, 20, 15, 0.16), 0 2px 8px rgba(20, 20, 15, 0.08);
        animation: boot-breathe 1.7s ease-in-out infinite;
      }
      html[data-theme="dark"] .boot-splash-logo {
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      @keyframes boot-breathe {
        0%, 100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.045);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-logo {
          animation: none;
        }
      }
      .boot-splash p {
        margin: 0;
        font-size: 12px;
        color: #6b6b66;
      }
      html[data-theme="dark"] .boot-splash p {
        color: rgba(255, 255, 255, 0.55);
      }
      /* 淡出：首屏数据到达后由 React 层加这个类，播完再卸载 */
      .boot-splash-leaving {
        animation: boot-fade-out 0.28s ease forwards;
      }
      @keyframes boot-fade-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <img class="boot-splash-logo" src="./icon.png" alt="" />
        <p>正在启动 Codex Harness…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
