<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="theme-color" content="#171916" />
    <title>Codex Harness Desktop</title>
    <style>
      /* 启动加载动画：React 挂载时会整体替换 #root 内容，动画自动消失 */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #171916;
        color: #e8e8e8;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .boot-splash-logo {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: #26282b;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.5px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .boot-splash-spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(255, 255, 255, 0.16);
        border-top-color: #7cabf8;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-splash p {
        margin: 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash-logo">CH</div>
        <div class="boot-splash-spinner"></div>
        <p>正在启动 Codex Harness…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
