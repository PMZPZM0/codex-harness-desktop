plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codexharness.remote'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "0.1.16"
    }

    // 两个包各自写死服务器地址：装完只要输 6 位连接码（扫码照旧可用）
    flavorDimensions "product"
    productFlavors {
        // 中转地址不落明文（用户看不到、strings 也搜不出来）：XOR 0x5A + base64，运行时解码
        harness {
            dimension "product"
            applicationId "com.codexharness.remote"
            manifestPlaceholders = [appLabel: "Codex 远控"]
            buildConfigField "String", "BASE_URL_B64", "\"Mi4uKilgdXUoPzc1Lj90Kioga2hpdDspMzs=\""
            /* 0.1.7：另一个产品的中转域名出现在本机存储里 = 旧版本串了，启动时丢弃 */
            buildConfigField "String", "STALE_BASE_HOST", "\"ppcode.pptoken.cc\""
        }
        ppcode {
            dimension "product"
            applicationId "com.ppcode.remote"
            manifestPlaceholders = [appLabel: "PPcode 远控"]
            buildConfigField "String", "BASE_URL_B64", "\"Mi4uKilgdXUqKjk1Pj90KiouNTE/NHQ5OXUoPzc1Lj8=\""
            buildConfigField "String", "STALE_BASE_HOST", "\"remote.ppz123.asia,ppcode.pptoken.cc:18443\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // 首版自用：release 也用 debug 签名，装完即可用；要上架/长期分发时再换正式 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // release 出包不跑 lintVital（本机 Windows 路径下它会报「文件名语法不正确」而中断构建）；
    // 需要静态检查时单独跑 ./gradlew lint，不挡打包。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}

// zxing-android-embedded 4.3.0 带的是 kotlin-stdlib 1.6.x，和 appcompat 拉上来的 1.8.x
// 有重复类（kotlin.io.path.*）。1.8 起 jdk7/jdk8 只是空壳 ⇒ 三个一起对齐即可。
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
