<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自媒体工作台</title>
<style>
  /* ⛔ 开源 dsh-media-desk 的样式全部建立在 DSH 宿主主题变量（--dsw-alias-*）上；
     宿主没注入这些变量时：背景 → transparent、文字 → 默认黑、弹窗遮罩 → 透明
     ⇒ 暗色下直接看不见、打开弹窗后整页被透明遮罩挡住（表现为「按键点不了」）。
     这里按 26 个实际用到的 token 补齐，亮/暗两套跟随系统（Electron nativeTheme）。 */
  :root {
    color-scheme: light;
    --dsw-alias-bg-base: #f5f5f3;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-bg-mask-1: rgba(15, 23, 42, 0.34);
    --dsw-alias-border-l2: rgba(15, 23, 42, 0.10);
    --dsw-alias-border-l4: rgba(15, 23, 42, 0.16);
    --dsw-alias-label-primary: #1f2328;
    --dsw-alias-label-primary-inverted: #ffffff;
    --dsw-alias-label-secondary: #4b5563;
    --dsw-alias-label-tertiary: #6b7280;
    --dsw-alias-label-caption: #8b93a1;
    --dsw-alias-link: #2f6fed;
    --dsw-alias-danger: #d14343;
    --dsw-alias-button-primary-fill: #2f6fed;
    --dsw-alias-button-primary-hover: #2560d8;
    --dsw-alias-interactive-bg-hover: rgba(15, 23, 42, 0.06);
    --dsw-alias-interactive-bg-active: rgba(15, 23, 42, 0.10);
    --dsw-elevation-soft: 0 2px 8px rgba(15, 23, 42, 0.08);
    --dsw-elevation-panel: 0 8px 24px rgba(15, 23, 42, 0.12);
    --dsw-elevation-prominent: 0 16px 48px rgba(15, 23, 42, 0.18);
    --dsw-font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --dsw-radius-xs: 6px;
    --dsw-radius-sm: 8px;
    --dsw-radius-md: 12px;
    --dsw-radius-lg: 16px;
    --dsw-radius-xl: 20px;
    --dsw-radius-panel: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --dsw-alias-bg-base: #1b1b1a;
      --dsw-alias-bg-layer-2: #262625;
      --dsw-alias-bg-mask-1: rgba(0, 0, 0, 0.52);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.10);
      --dsw-alias-border-l4: rgba(255, 255, 255, 0.16);
      --dsw-alias-label-primary: #ececeb;
      --dsw-alias-label-primary-inverted: #101010;
      --dsw-alias-label-secondary: #b9b9b6;
      --dsw-alias-label-tertiary: #9a9a97;
      --dsw-alias-label-caption: #8a8a86;
      --dsw-alias-link: #7aa7ff;
      --dsw-alias-danger: #ff7a7a;
      --dsw-alias-button-primary-fill: #6c98ff;
      --dsw-alias-button-primary-hover: #7aa7ff;
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
      --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.12);
      --dsw-elevation-soft: 0 2px 8px rgba(0, 0, 0, 0.35);
      --dsw-elevation-panel: 0 8px 24px rgba(0, 0, 0, 0.45);
      --dsw-elevation-prominent: 0 16px 48px rgba(0, 0, 0, 0.55);
    }
  }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font-family: var(--dsw-font-family);
    overflow: hidden;
  }
  #md-fatal { padding: 24px; font: 13px/1.6 var(--dsw-font-family); color: var(--dsw-alias-danger); white-space: pre-wrap; }
  /* 11-11 用户「排版做好自适应，这么大空白呢」：原版 .md-style-grid 用 auto-fill，
     分类只有 2 张卡时第 3 列整列留空 —— 改 auto-fit：卡少的分类自动铺满整行，窄窗自动降列。 */
  .md-root .md-style-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) !important; }
  /* 看板横向滚动条：上游横条挂在 1700+px 内容底部，要滚到底才够得着。
     glue.js 在看板之后插一条镜像横条，sticky 贴**可视区底部**常驻（11-12 用户：
     「这底下滚轮放错了，我要滚下去才能看见」→ 放底部常驻，别再挪到顶部）。
     原生横条隐藏，避免出现两条。 */
  .md-bottom-xscroll {
    /* 挂在 .md-content（不滚动的可视面板）上贴底，不随 .md-page 滚动 ⇒ 一直看得见。
       宽度/左边距由 glue.js 按看板实测写入。 */
    position: absolute;
    bottom: 6px;
    z-index: 8;
    height: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    /* 贴底时盖住下面滚过的卡片边缘，否则半透明内容会从条里透出来 */
    background: var(--dsw-alias-bg-base);
  }
  .md-bottom-xscroll::-webkit-scrollbar { height: 8px; }
  .md-bottom-xscroll::-webkit-scrollbar-track { background: transparent; }
  .md-bottom-xscroll::-webkit-scrollbar-thumb {
    background: var(--dsw-alias-border-l4);
    border-radius: 999px;
  }
  .md-bottom-xscroll::-webkit-scrollbar-thumb:hover { background: var(--dsw-alias-label-caption); }
  .md-bottom-xscroll-inner { height: 2px; }
  html body .md-root .md-page .md-board { overflow-x: hidden !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.__ModuleLoader__ = {
    load: function (entry) {
      try {
        window.__mdModule = entry.factory(function require(name) {
          if (name === "react") return window.MDReact.React;
          throw new Error("未提供的模块：" + name);
        });
      } catch (error) {
        document.getElementById("root").innerHTML = '<pre id="md-fatal"></pre>';
        document.getElementById("md-fatal").textContent = "客户端加载失败：" + (error && error.message || error);
      }
    }
  };
</script>
<script src="./react.bundle.js"></script>
<script src="./client.js"></script>
<script src="./glue.js"></script>
</body>
</html>
