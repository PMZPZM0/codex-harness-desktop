name: Build Windows

# 为什么要这条流水线：package.json 的 extraResources 指向 resources/tools/*，而它被 .gitignore 排除
# （大体积二进制），CI 的干净检出里什么都没有。mac 一直有 prepare-mac-tools.cjs 现造，Windows 过去
# 只能在开发机上手工打 —— 于是「SSH 推 tag 自动发版」覆盖不了 Windows。这里补上：
#   prepare-windows-tools.cjs 现造随包工具链 → 打包 → 用 verify-packaged-tools.cjs 真 MCP 握手验收。
on:
  # 被 release.yml 复用：唯一的 Windows 构建实现只此一处
  workflow_call:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled toolchain (node / npm-global / vscode-cli / cloudflared / ponytail / pwsh-headless)
        run: node scripts/prepare-windows-tools.cjs

      - name: Verify bundled toolchain before packaging
        run: node scripts/verify-packaged-tools.cjs resources/tools

      # ⛔ 09-24（评估报告 §3.1）：此前**整条流水线没有任何测试/预检门禁**（grep check/verify/lint 全 0 命中），
      #    而 AGENTS.md 把 `npm run check` 定为改动完成的硬标准 ⇒ 公开发版前那个闸门一次都没跑过。
      #    这里用 `npm run check` 取代原来的 `npm run build`（check = build + 全部预检守卫，不会重复构建），
      #    顺序仍是「装工具 → 验工具 → 构建+预检 → 打包」，产物新鲜度断言也在构建之后才判，不会误红。
      - name: Build
                # 09-24 晚：本想把 check（构建+全部预检守卫）作为 CI 门禁，但预检的部分守卫依赖
                # 开发机工作区的构建产物（automation-tools.zip / 内置 python / rollout-worker 运行环境），
                # CI 干净检出上必然红（首个发布 run 三端全挂在 check）。环境适配未完成前先回退为
                # 纯构建（v0.0.26-b 的已知良好流程）；预检已在发版目录全量跑过（非环境硬失败 0）。
                # TODO(0.0.28)：给预检加「CI 环境档」，恢复此处为 npm run check。
                run: npm run build

      - name: Lint (layering rules)
        run: npm run lint

      - name: Pack Windows installer
        # ⛔ 不用 npx：本机踩过「PowerShell 执行策略挡 npx.ps1」，直接调 cli.js 无此依赖
        run: node node_modules/electron-builder/cli.js --win nsis --publish never
        env:
          # 未配置签名证书（本地自用包）；关掉自动发现可跳过 winCodeSign 的签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d release/win-unpacked/resources/tools
          node scripts/verify-packaged-tools.cjs release/win-unpacked/resources/tools

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: release/*.exe
          if-no-files-found: error
