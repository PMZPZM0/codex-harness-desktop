<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex Harness · 版本发布中心</title>
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3E%3C%2Ftext%3E%3C/svg%3E" />
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo">⌬</div>
    <span>Codex Harness</span>
  </div>
  <div class="nav-links">
    <a href="/" class="active">下载</a>
    <a href="/feedback.html">反馈</a>
    <a href="/admin.html">管理</a>
    <a href="/api/health" target="_blank">API</a>
    <a href="https://github.com/PMZPZM0/codex-harness-desktop" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
  <div class="right">
    <span class="pill"><span class="dot"></span>服务正常</span>
  </div>
</nav>

<main>
  <!-- Hero -->
  <section class="hero">
    <div class="left">
      <h1>下载最新版本</h1>
      <p class="sub">
        Codex Harness 桌面端的官方发布渠道。所有安装包均经过管理员审核，附 SHA-256 与更新日志。桌面端启动时也会自动到这里检查更新。
      </p>
      <div class="quick">
        <button class="btn btn-primary" id="btn-latest">下载最新版</button>
        <button class="btn" id="btn-refresh">刷新列表</button>
        <a class="btn btn-ghost" href="https://github.com/PMZPZM0/codex-harness-desktop" target="_blank" rel="noopener">查看 GitHub 仓库 ↗</a>
      </div>
    </div>
    <div class="hero-card">
      <div class="label">当前最新版本</div>
      <div class="version" id="hero-version">—</div>
      <div class="meta">
        <span id="hero-channel">stable</span>
        <span class="sep">·</span>
        <span id="hero-size">—</span>
        <span class="sep">·</span>
        <span id="hero-time">—</span>
      </div>
    </div>
  </section>

  <!-- Channel Tabs -->
  <div class="section-head">
    <h2>所有发布版本</h2>
    <span class="hint">按 channel 分组 · 点击卡片右上角的强制标识查看详情</span>
  </div>
  <div class="tabs" id="channel-tabs">
    <button class="tab active" data-channel="stable">stable</button>
    <button class="tab" data-channel="beta">beta</button>
    <button class="tab" data-channel="canary">canary</button>
  </div>

  <div id="grid" class="grid"></div>
</main>

<div id="toast-host"></div>

<script src="/assets/user.js"></script>
</body>
</html>
